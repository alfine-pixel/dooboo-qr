<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooboo — Kitchen Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #2b2b2b;
    --card-bg: #ffffff;
    --new: #2563eb;
    --prep: #ffffff;
    --done: #ffb84a;
    --red: #ff4a4a;
    --hold: #8a4aff;
    --text: #1a1a1a;
    --muted: #777;
    --border: #ddd;
    --highlight: #fff3cd;
    --green-dark: #3a7d3a;
    --green-light: #6fbf6f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
  }

  header {
    background: #000;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: white; }

  .section-filter {
    display: flex;
    gap: 8px;
  }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .filter-btn.active { border-color: white; color: white; background: #333; }

  .clock { font-size: 18px; font-weight: bold; color: var(--muted); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 12px;
  }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .board { grid-template-columns: 1fr; }
  }

  .order-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .order-card.urgent {
    border-color: var(--red);
    box-shadow: 0 0 0 1px var(--red);
  }

  .card-header {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #000;
  }

  .header-table { background: linear-gradient(135deg, var(--green-light), var(--green-dark)); color: #fff; }
  .header-counter { background: linear-gradient(135deg,#9b6bff,#6a3ee8); color:#fff; }

  .table-num { font-size: 20px; font-weight: bold; }
  .table-sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  .timer {
    font-size: 16px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.25);
  }
  .timer-green { color: #fff; }
  .timer-yellow { color: #fff3cd; }
  .timer-red { color: #fff; background: var(--red); }

  .order-items {
    padding: 8px 14px;
    flex: 1;
  }

  .order-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    border-left: 4px solid transparent;
  }
  .order-item:last-child { border-bottom: none; }
  .order-item.highlight { background: var(--highlight); margin: 0 -14px; padding: 8px 14px; }

  .item-main { font-size: 15px; line-height: 1.4; font-weight: bold; }
  .item-qty { color: var(--new); font-weight: bold; margin-right: 6px; }
  .item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

   .order-item.item-done {
    background: #b9d9a8;
    margin: 0 -14px;
    padding: 8px 14px;
    border-left-color: #5a9a4a;
  }
  
   .order-item.item-preparing {
    background: #ffe3a8;
    margin: 0 -14px;
    padding: 8px 14px;
    border-left-color: #d4a040;
  }
  
  .order-item.item-hold {
    background: #c9a4ff;
    margin: 0 -14px;
    padding: 8px 14px;
    border-left-color: #7a3acc;
  }

   .order-item.item-recook {
    background: #e6c9c0;
    margin: 0 -14px;
    padding: 8px 14px;
    border-left-color: #b56a4a;
  }
 
  .order-item.item-requested {
    background: #aee0ff;
    margin: 0 -14px;
    padding: 8px 14px;
    border-left-color: #2a8acc;
  }
 
  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-box {
    background: #1c1c1c;
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90%;
    max-width: 420px;
    padding: 20px;
  }
  .modal-title {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .modal-item-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 16px;
  }
  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .modal-btn {
    padding: 16px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .modal-btn:hover { opacity: 0.85; }
  .modal-btn:active { transform: scale(0.97); }
  .btn-completed { background: #b9d9a8; color: #143; }
  .btn-request { background: #aee0ff; color: #034; }
  .btn-hold { background: var(--hold); color: #033; }
  .btn-preparing { background: #ffe3a8; color: #432; }
  .btn-recook { background: #e6c9c0; color: #531; }
  .btn-reset { background: var(--red); color: #fff; }
  .btn-delete { background: #444; color: var(--muted); }
  .btn-cancel {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }

  .done-btn {
    width: 100%;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    background: var(--green-dark);
    color: #fff;
    transition: opacity 0.2s;
  }
  .done-btn:hover { opacity: 0.85; }
  .done-btn.is-done { background: var(--done); color: #000; }
 
  .empty-board {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 16px;
    grid-column: 1 / -1;
  }

  .total-count {
    background: #333;
    color: white;
    border-radius: 10px;
    padding: 2px 10px;
    font-size: 13px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🍲 KITCHEN <span class="total-count" id="totalCount">0</span></div>
  <div class="section-filter">
    <button class="filter-btn active" onclick="setSection('ALL')">ALL</button>
    <button class="filter-btn" onclick="setSection('Soon-Tofu')">Soon-Tofu</button>
    <button class="filter-btn" onclick="setSection('Grill')">Grill</button>
    <button class="filter-btn" onclick="setSection('Fryer')">Fryer</button>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<div class="board" id="board"></div>

<div id="modalContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwSCTrTUhhCZfhoI5YOu3ab0qB8N4Nq8g",
  authDomain: "dooboo-qr.firebaseapp.com",
  databaseURL: "https://dooboo-qr-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dooboo-qr",
  storageBucket: "dooboo-qr.firebasestorage.app",
  messagingSenderId: "492622836549",
  appId: "1:492622836549:web:79de70997b1b081014042c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentSection = 'ALL';
let allItems = {};

window.setSection = function(sec) {
  currentSection = sec;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === sec);
  });
  render();
};

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// Timer helpers
function getTimerClass(ms) {
  const mins = ms / 60000;
  if (mins < 5) return 'timer-green';
  if (mins < 10) return 'timer-yellow';
  return 'timer-red';
}
function formatTimer(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// Firebase listener
const ordersRef = ref(db, 'orderItems');
onValue(ordersRef, snap => {
  allItems = snap.val() || {};
  render();
});

function groupByOrder() {
  const groups = {};
  Object.entries(allItems).forEach(([key, item]) => {
    if (!['NEW','PREPARING','HOLD','RECOOK','REQUEST','DONE'].includes(item.status)) return;
    const oid = item.orderId || key;
    if (!groups[oid]) groups[oid] = { orderId: oid, table: item.table, createdAt: item.createdAt, items: [] };
    groups[oid].items.push({ key, ...item });
    if (item.createdAt < groups[oid].createdAt) groups[oid].createdAt = item.createdAt;
  });
  // drop fully-done groups
  return Object.values(groups).filter(g => g.items.some(it => it.status !== 'DONE'));
}

function groupContainsSection(group, section) {
  if (section === 'ALL') return true;
  return group.items.some(it => it.section === section);
}

function render() {
  const now = Date.now();
  const board = document.getElementById('board');
  const groups = groupByOrder().filter(g => groupContainsSection(g, currentSection));

  document.getElementById('totalCount').textContent = groups.length;

  if (groups.length === 0) {
    board.innerHTML = `<div class="empty-board">No active orders</div>`;
    return;
  }

  groups.sort((a,b) => a.createdAt - b.createdAt);

  board.innerHTML = '';
  groups.forEach(group => {
    const elapsed = now - group.createdAt;
    const timerClass = getTimerClass(elapsed);
    const isUrgent = timerClass === 'timer-red' || group.items.some(it => it.status === 'REQUEST');

    const isCounter = group.table === 'COUNTER' || group.table === 'counter';
    const headerClass = isCounter ? 'header-counter' : 'header-table';
    const tableLabel = isCounter ? 'COUNTER' : `Table ${group.table}`;

    // overall group status: PREPARING if any item NEW or PREPARING but not all NEW... 
    // rule: if any item is PREPARING -> group acts as PREPARING (done btn visible/active)
    const allDone = group.items.every(it => it.status === 'DONE');

    const itemsHtml = group.items.map(it => {
      const highlight = currentSection !== 'ALL' && it.section === currentSection;
      let stateClass = '';
      if (it.status === 'DONE') stateClass = 'item-done';
      else if (it.status === 'PREPARING') stateClass = 'item-preparing';
      else if (it.status === 'HOLD') stateClass = 'item-hold';
      else if (it.status === 'RECOOK') stateClass = 'item-recook';
      else if (it.status === 'REQUEST') stateClass = 'item-requested';
      return `
        <div class="order-item ${highlight ? 'highlight' : ''} ${stateClass}" onclick="openItemModal('${it.key}')">
          <div class="item-main">
            <span class="item-qty">${it.qty}×</span>${it.name}
            ${it.note ? `<div class="item-sub">📝 ${it.note}</div>` : ''}
            <div class="item-sub">${it.section || ''}${it.status !== 'NEW' ? ' · ' + (it.status === 'REQUEST' ? '⚡REQUEST' : it.status === 'DONE' ? 'COMPLETED' : it.status) : ''}</div>
          </div>
        </div>
      `;
    }).join('');

    const card = document.createElement('div');
    card.className = `order-card ${isUrgent ? 'urgent' : ''}`;
    card.innerHTML = `
      <div class="card-header ${headerClass}">
        <div>
          <div class="table-num">${tableLabel}</div>
          <div class="table-sub">Order ${group.orderId.slice(-6)}</div>
        </div>
        <span class="timer ${timerClass}">${formatTimer(elapsed)}</span>
      </div>
      <div class="order-items">${itemsHtml}</div>
      <button class="done-btn ${allDone ? 'is-done' : ''}" onclick='completeGroup(${JSON.stringify(group.items.map(it=>it.key))})'>
        ${allDone ? '✓ COMPLETED' : 'DONE ✓'}
      </button>
    `;
    board.appendChild(card);
  });
}

// Refresh timers periodically
setInterval(() => render(), 5000);

window.openItemModal = function(key) {
  const item = allItems[key];
  if (!item) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${item.section || ''}${item.table ? ' · Table ' + item.table : ''}</div>
      <div class="modal-item-name">${item.qty}× ${item.name}</div>
      <div class="modal-grid">
        <button class="modal-btn btn-completed" onclick="setItemStatus('${key}','DONE')">COMPLETED</button>
        <button class="modal-btn btn-request" onclick="setItemStatus('${key}','REQUEST')">REQUEST</button>
        <button class="modal-btn btn-preparing" onclick="setItemStatus('${key}','PREPARING')">PREPARING</button>
        <button class="modal-btn btn-hold" onclick="setItemStatus('${key}','HOLD')">HOLD</button>
        <button class="modal-btn btn-recook" onclick="setItemStatus('${key}','RECOOK')">RECOOK</button>
        <button class="modal-btn btn-reset" onclick="setItemStatus('${key}','NEW')">RESET</button>
      </div>
      <button class="modal-btn btn-delete" style="width:100%" onclick="deleteItem('${key}')">DELETE</button>
      <button class="btn-cancel" onclick="closeModal()">CANCEL</button>
    </div>
  `;
  document.getElementById('modalContainer').appendChild(overlay);
};

window.closeModal = function() {
  const c = document.getElementById('modalContainer');
  c.innerHTML = '';
};

window.setItemStatus = async function(key, newStatus) {
  await update(ref(db, `orderItems/${key}`), { status: newStatus });
  closeModal();
};
 
window.deleteItem = async function(key) {
  await remove(ref(db, `orderItems/${key}`));
  closeModal();
};

window.completeGroup = async function(keys) {
  // Optimistic update: remove from local data and re-render immediately
  keys.forEach(k => {
    if (allItems[k]) allItems[k] = { ...allItems[k], status: 'DONE' };
  });
  render();

  const updates = {};
  keys.forEach(k => { updates[`orderItems/${k}/status`] = 'DONE'; });
  await update(ref(db), updates);
};
</script>
</body>
</html>
