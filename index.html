<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dooboo — Order</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #16a34a;
    --primary-light: #e8f5e9;
    --dark: #1a1a1a;
    --bg: #ffffff;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --border: #ececec;
    --badge: #fff3cd;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 120px;
  }

  header {
    background: #ffffff;
    color: var(--text);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .back-btn {
    font-size: 20px;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
  }

  .header-title {
    flex: 1;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
  }

  .table-badge {
    background: var(--primary);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    flex-shrink: 0;
  }

  

  .section-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    background: white;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 49px;
    z-index: 99;
    scrollbar-width: none;
  }
  .section-tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 8px 16px;
    white-space: nowrap;
    cursor: pointer;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    background: white;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .tab.active {
    color: var(--primary);
    border-color: var(--primary);
    background: var(--primary-light);
    font-weight: bold;
  }

  .section-title {
    padding: 20px 16px 4px;
    font-size: 24px;
    font-weight: 800;
    color: var(--dark);
  }

  .section-desc {
    padding: 0 16px 12px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .menu-list { padding: 0 16px; }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    gap: 12px;
  }

  .item-info { flex: 1; }
  .item-name { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
  .item-name .crown { font-size: 14px; margin-left: 4px; }
  .item-subtitle { font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 6px; }
  .item-price { font-size: 15px; font-weight: bold; color: var(--text); margin-top: 8px; }
  .spice-icon { display: inline-block; font-size: 14px; margin-left: 4px; }

  .item-image {
    width: 96px;
    height: 96px;
    border-radius: 10px;
    background: var(--border);
    flex-shrink: 0;
    object-fit: cover;
  }

  /* Cart */
  .cart-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--dark);
    color: white;
    padding: 16px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    z-index: 200;
  }
  .cart-bar.visible { display: flex; }
  .cart-count {
    background: var(--primary);
    color: white;
    border-radius: 50%;
    width: 24px; height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    margin-right: 8px;
  }
  .cart-total { font-size: 16px; }
  .cart-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal h3 { font-size: 18px; margin-bottom: 16px; }

  .option-group { margin-bottom: 16px; }
  .option-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

  .option-btn {
    display: inline-block;
    padding: 8px 16px;
    border: 2px solid var(--border);
    border-radius: 20px;
    margin: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .option-btn.selected {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
  }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 16px 0;
  }
  .qty-btn {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-radius: 50%;
    background: white;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-size: 20px; font-weight: bold; min-width: 30px; text-align: center; }

  .note-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 8px;
  }

  .add-btn {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
  }

  /* Cart modal */
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 15px; font-weight: bold; }
  .cart-item-sub { font-size: 12px; color: var(--muted); }
  .cart-item-price { font-weight: bold; color: var(--primary); margin: 0 12px; }
  .remove-btn { color: var(--muted); cursor: pointer; font-size: 18px; }

  .payment-section { margin-top: 16px; }
  .payment-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: bold; }
  .payment-btns { display: flex; gap: 10px; }
  .pay-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .pay-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: bold; }

  .place-btn {
    width: 100%;
    background: var(--dark);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 16px;
    font-weight: bold;
    border-top: 2px solid var(--dark);
    margin-top: 8px;
  }

  .success-msg {
    text-align: center;
    padding: 30px 20px;
  }
  .success-msg .icon { font-size: 48px; margin-bottom: 12px; }
  .success-msg h3 { font-size: 22px; margin-bottom: 8px; }
  .success-msg p { color: var(--muted); }

  .close-btn {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 24px;
    cursor: pointer;
    color: var(--muted);
  }
  .modal { position: relative; }
</style>
</head>
<body>

<header>
  <span class="back-btn">←</span>
  <div class="header-title" id="headerTitle">Dooboo</div>
  <div class="table-badge" id="tableLabel">Table —</div>
</header>

<div class="section-tabs" id="sectionTabs"></div>

<div id="menuContent"></div>

<div class="cart-bar" id="cartBar">
  <div>
    <span class="cart-count" id="cartCount">0</span>
    <span class="cart-total" id="cartTotal">$0.00</span>
  </div>
  <button class="cart-btn" onclick="openCart()">View Order →</button>
</div>

<!-- Item modal -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <span class="close-btn" onclick="closeItemModal()">×</span>
    <h3 id="modalItemName"></h3>
    <div id="modalPrice" style="color:var(--primary);font-size:18px;margin-bottom:12px;"></div>
    <div id="modalOptions"></div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-num" id="qtyNum">1</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <div>
      <div class="option-label">Special Request</div>
      <input class="note-input" id="itemNote" placeholder="e.g. no onion, extra spicy...">
    </div>
    <button class="add-btn" id="addBtn" onclick="addToCart()">Add to Order — $0.00</button>
  </div>
</div>

<!-- Success modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div class="success-msg">
      <div class="icon">✅</div>
      <h3>Order Placed!</h3>
      <p>Your order has been sent to the kitchen.<br>Please wait at your table.</p>
      <br>
      <button class="place-btn" onclick="document.getElementById('successModal').classList.remove('open')">OK</button>
    </div>
  </div>
</div>
 
<!-- Cart modal -->
<div class="modal-overlay" id="cartModal">
  <div class="modal">
    <span class="close-btn" onclick="closeCart()">×</span>
    <h3>Your Order</h3>
    <div id="cartItems"></div>
    <div class="total-row">
      <span>Total</span>
      <span id="cartTotalModal">$0.00</span>
    </div>
    <div class="payment-section">
      <div class="payment-label">Payment Method</div>
      <div class="payment-btns">
        <button class="pay-btn selected" id="payCash" onclick="selectPayment('cash')">💵 Cash</button>
        <button class="pay-btn" id="payCard" onclick="selectPayment('card')">💳 Card</button>
      </div>
    </div>
    <button class="place-btn" onclick="placeOrder()">Place Order</button>
  </div>
</div>

    { id: "fr7", name: "Veggie Fried Dumpling (4pcs)", subtitle: "야채 군만두 (4개)", desc: "Crispy fried dumplings filled with seasoned vegetables", price: 9.8, spicy: false, popular: false, image: "", options: {} },
    { id: "fr8", name: "Meat Fried Dumpling (4pcs)", subtitle: "고기 군만두 (4개)", desc: "Crispy fried dumplings filled with seasoned meat and vegetables", price: 10.8, spicy: false, popular: false, image: "", options: {} },

  ]
};
// State
let cart = [];
let currentItem = null;
let currentQty = 1;
let selectedOptions = {};
let selectedPayment = 'cash';
let tableNum = 1;

// Get table from URL
const params = new URLSearchParams(window.location.search);
tableNum = params.get('table') || '1';
 // 결제 완료 후 처리
if (params.get('payment') === 'success') {
  setTimeout(() => showSuccess(), 500);
  window.history.replaceState({}, '', `/?table=${tableNum}`);
}
document.getElementById('tableLabel').textContent = `Table ${tableNum}`;

// Build tabs & menu
const tabs = document.getElementById('sectionTabs');
const content = document.getElementById('menuContent');

Object.entries(MENU).forEach(([section, items], idx) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (idx === 0 ? ' active' : '');
  tab.textContent = section;
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('sec-' + section).scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  tabs.appendChild(tab);

  const sec = document.createElement('div');
  sec.id = 'sec-' + section;
  sec.innerHTML = `<div class="section-title">${section}</div><div class="menu-list"></div>`;
  const list = sec.querySelector('.menu-list');

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'menu-item';
    const crown = item.popular ? ' <span class="crown">👑</span>' : '';
    const spice = item.spicy ? ' <span class="spice-icon">🌶️</span>' : '';
    const subtitle = item.subtitle ? `${item.subtitle} ` : '';
    div.innerHTML = `
      <div class="item-info">
        <div class="item-name">${item.name}${crown}</div>
        <div class="item-subtitle">${subtitle}${item.desc || ''}</div>
        <div class="item-price">$${item.price.toFixed(2)}${spice}</div>
      </div>
      ${item.image ? `<img class="item-image" src="${item.image}" alt="${item.name}">` : `<div class="item-image"></div>`}
    `;
    div.onclick = () => openItemModal(item);
    list.appendChild(div);
  });

  content.appendChild(sec);
});

// Item modal
window.openItemModal = function(item) {
  currentItem = item;
  currentQty = 1;
  selectedOptions = {};
  document.getElementById('modalItemName').textContent = item.name;
  document.getElementById('modalPrice').textContent = `$${item.price.toFixed(2)}`;
  document.getElementById('itemNote').value = '';
  document.getElementById('qtyNum').textContent = 1;

  const optDiv = document.getElementById('modalOptions');
  optDiv.innerHTML = '';

  Object.entries(item.options).forEach(([group, opts]) => {
    const g = document.createElement('div');
    g.className = 'option-group';
    g.innerHTML = `<div class="option-label">${group}</div>`;
    opts.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        g.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedOptions[group] = opt;
        updateAddBtn();
      };
      g.appendChild(btn);
    });
    optDiv.appendChild(g);
  });

  updateAddBtn();
  document.getElementById('itemModal').classList.add('open');
};

window.closeItemModal = () => document.getElementById('itemModal').classList.remove('open');

window.changeQty = function(d) {
  currentQty = Math.max(1, currentQty + d);
  document.getElementById('qtyNum').textContent = currentQty;
  updateAddBtn();
};

function updateAddBtn() {
  let price = currentItem.price;
  Object.values(selectedOptions).forEach(opt => {
    const match = opt.match(/\+\$(\d+)/);
    if (match) price += parseFloat(match[1]);
  });
  const total = price * currentQty;
  document.getElementById('addBtn').textContent = `Add to Order — $${total.toFixed(2)}`;
}

window.addToCart = function() {
  let price = currentItem.price;
  Object.values(selectedOptions).forEach(opt => {
    const match = opt.match(/\+\$(\d+)/);
    if (match) price += parseFloat(match[1]);
  });
  cart.push({
    id: currentItem.id,
    name: currentItem.name,
    price,
    qty: currentQty,
    options: { ...selectedOptions },
    note: document.getElementById('itemNote').value
  });
  closeItemModal();
  updateCartBar();
};

function updateCartBar() {
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
  document.getElementById('cartBar').classList.toggle('visible', cart.length > 0);
}

// Cart modal
window.openCart = function() {
  const itemsDiv = document.getElementById('cartItems');
  if (!itemsDiv) return;
  itemsDiv.innerHTML = '';
  cart.forEach((item, idx) => {
    const optStr = Object.entries(item.options).map(([k,v]) => `${k}: ${v}`).join(', ');
    const d = document.createElement('div');
    d.className = 'cart-item';
    d.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">${item.qty}× ${item.name}</div>
        ${optStr ? `<div class="cart-item-sub">${optStr}</div>` : ''}
        ${item.note ? `<div class="cart-item-sub">📝 ${item.note}</div>` : ''}
      </div>
      <div class="cart-item-price">$${(item.price * item.qty).toFixed(2)}</div>
      <div class="remove-btn" onclick="removeItem(${idx})">×</div>
    `;
    itemsDiv.appendChild(d);
  });
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('cartTotalModal').textContent = `$${total.toFixed(2)}`;
  document.getElementById('cartModal').classList.add('open');
};

window.closeCart = () => document.getElementById('cartModal').classList.remove('open');

window.removeItem = function(idx) {
  cart.splice(idx, 1);
  updateCartBar();
  if (cart.length === 0) { closeCart(); return; }
  openCart();
};

window.selectPayment = function(method) {
  selectedPayment = method;
  document.getElementById('payCash').classList.toggle('selected', method === 'cash');
  document.getElementById('payCard').classList.toggle('selected', method === 'card');
};

window.placeOrder = async function() {
  if (cart.length === 0) return;
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const order = {
    table: tableNum,
    items: cart,
    total,
    payment: selectedPayment,
    status: selectedPayment === 'cash' ? 'NEW' : 'PENDING_PAYMENT',
    createdAt: Date.now()
  };
  try {
const ordersRef = ref(db, 'orders');
    const newRef = await push(ordersRef, order);
    const orderId = newRef.key;

    // 아이템별로 개별 저장
    const itemsRef = ref(db, 'orderItems');
    for (const item of cart) {
      await push(itemsRef, {
        orderId,
        table: tableNum,
        name: item.name,
        qty: item.qty,
        price: item.price,
        options: item.options || {},
        note: item.note || '',
        section: item.id.startsWith('st') ? 'Soon-Tofu' : item.id.startsWith('gr') ? 'Grill' : 'Fryer',
        status: 'NEW',
        createdAt: Date.now()
      });
    }

    if (selectedPayment === 'card') {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart, table: tableNum, orderId })
      });
      const data = await res.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert('Payment failed. Please try again.');
      }
    } else {
      cart = [];
      updateCartBar();
      closeCart();
      showSuccess();
    }
  } catch (e) {
    alert('Order failed. Please try again.');
    console.error(e);
  }
};

function showSuccess() {
  document.getElementById('successModal').classList.add('open');
}
</script>
</body>
